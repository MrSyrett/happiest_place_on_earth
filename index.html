0},{id:"dl_railroad_full",from:900,to:1440,park:"dl",kind:"bad",when:"day",w:3,title:"The train left without you",text:"Full at Main Street. The next one is twenty minutes and you can walk it faster.",joy:-4,energy:-4,minutesLost:8},{id:"dca_racers_win",park:"dca",kind:"good",when:"day",w:6,title:"Your car won the race",text:"Down the last straight side by side and yours pulled ahead. The whole car cheered.",joy:12},{id:"dca_soarin_front",park:"dca",kind:"good",when:"day",w:5,title:"Front row on Soarin'",text:"No feet dangling in your eyeline for once. It's a completely different ride.",joy:10,comfort:6},{id:"dca_grizzly_dry",park:"dca",kind:"good",when:"day",w:4,title:"You came off Grizzly bone dry",text:"Everyone else in the raft is soaked and cannot understand how you managed it.",joy:9},{id:"dca_incredi_front",park:"dca",kind:"good",when:"day",w:5,title:"Front car on Incredicoaster",text:"That first launch with nothing in front of you is the best five seconds in the park.",joy:11},{id:"dca_carsland_neon",from:1140,to:1440,park:"dca",kind:"good",when:"day",w:5,title:"Radiator Springs at lighting time",text:"The whole street comes on at once, the neon hums, and everyone stops walking.",joy:14,comfort:4,minutesLost:10},{id:"dca_luigi",park:"dca",kind:"good",when:"day",w:4,title:"Luigi's cars actually dance",text:"You forget it's a ride and just watch them work. The song is in your head now regardless.",joy:7},{id:"dca_mater",park:"dca",kind:"good",when:"day",w:3,title:"You got the good Mater song",text:"There are several and this is the one worth having.",joy:6},{id:"dca_web_highscore",park:"dca",kind:"good",when:"day",w:5,title:"You topped the car on WEB SLINGERS",text:"Both arms aching, entirely worth it, and you have the screen to prove it.",joy:11,energy:-5},{id:"dca_spidey",park:"dca",kind:"good",when:"day",w:5,title:"The Spider-Man stunt landed clean",text:"Straight up the side of the building and over. Nobody quite believes what they've seen.",joy:10},{id:"dca_avengers_char",park:"dca",kind:"good",when:"day",w:4,title:"Loki held court in Avengers Campus",text:"Fully in character, entirely unbothered by the queue forming, and very funny.",joy:11,minutesLost:10},{id:"dca_bakery_sample",park:"dca",kind:"good",when:"day",w:5,title:"Free sourdough at the end of the tour",text:"Still warm. You take two and nobody says anything.",joy:7,fuel:12,comfort:3},{id:"dca_ghirardelli",park:"dca",kind:"good",when:"day",w:5,title:"The chocolate square is still free",text:"Walk in, take one, walk out. Best value in the resort.",joy:7,fuel:8},{id:"dca_lamplight_view",park:"dca",kind:"good",when:"day",w:4,title:"A table on the Lamplight balcony",text:"Right over the water with the pier lit up. You didn't book it and got it anyway.",joy:13,energy:12,fuel:30,comfort:16,money:-48,minutesLost:45},{id:"dca_woc_rail",from:1140,to:1350,park:"dca",kind:"good",when:"day",w:5,title:"Front rail for World of Color",text:"You got there early enough and the whole lagoon is yours to look at.",joy:13,energy:-4,minutesLost:25},{id:"dca_trolley",park:"dca",kind:"good",when:"day",w:4,title:"The Red Car Trolley came along",text:"You weren't waiting for it, but you're not going to walk when that's an option.",joy:7,energy:8,comfort:6,minutesLost:8},{id:"dca_animation",park:"dca",kind:"good",when:"day",w:4,title:"You drew a passable Mickey",text:"Twenty minutes in the cool and dark, and you're taking the paper home.",joy:9,energy:8,comfort:14,minutesLost:20},{id:"dca_crush",park:"dca",kind:"good",when:"day",w:5,title:"Crush picked you out",text:"A full conversation in front of a hundred people. You did not have anything clever ready.",joy:12,comfort:10},{id:"dca_geyser",park:"dca",kind:"good",when:"day",w:4,title:"The Grizzly geyser caught the raft behind",text:"Not you. Them. You watched it happen and it was magnificent.",joy:8},{id:"dca_boardwalk_win",park:"dca",kind:"good",when:"day",w:3,title:"You actually won on the Boardwalk",text:"A stuffed thing bigger than your bag, which you will now carry for nine hours.",joy:10,energy:-4,money:-12},{id:"dca_pier_sunset",from:1080,to:1260,park:"dca",kind:"good",when:"day",w:5,title:"Sunset behind Pixar Pier",text:"The wheel and the coaster in silhouette, and the whole lagoon gone gold.",joy:11,comfort:4},{id:"dca_philhar",park:"dca",kind:"good",when:"day",w:3,title:"PhilharMagic in an empty theatre",text:"Cool, dark, forty-five people in a room that seats hundreds.",joy:8,energy:9,comfort:15,minutesLost:16},{id:"dca_zephyr",park:"dca",kind:"good",when:"day",w:3,title:"Golden Zephyr at the right hour",text:"It only runs when the wind is calm, and the view out over the water is worth the wait.",joy:7,comfort:4},{id:"dca_wharf_short",park:"dca",kind:"good",when:"day",w:4,title:"No queue at the wharf",text:"Every counter open at once. You eat properly for the first time today.",joy:8,fuel:26,comfort:8,money:-17,minutesLost:18},{id:"dca_monsters_taxi",park:"dca",kind:"good",when:"day",w:3,title:"The taxi driver knew your name",text:"They read it off your bag and worked it into the spiel. Small thing, well done.",joy:7},{id:"dca_pier_gull_standoff",park:"dca",kind:"good",when:"day",w:3,title:"You out-stared a gull",text:"It considered your churro at length, thought better of it, and left.",joy:6},{id:"dca_split",park:"dca",kind:"bad",when:"day",w:5,title:"Single rider split you up",text:"You rode Racers separately and spent the whole thing wishing you hadn't bothered.",joy:-7},{id:"dca_grizzly_soaked",park:"dca",kind:"bad",when:"day",w:5,title:"Completely soaked on Grizzly",text:"Shoes included. You'll be squelching until the sun gets round to drying you.",joy:-4,comfort:-18},{id:"dca_incredi_stall",park:"dca",kind:"bad",when:"day",w:4,title:"Held on the Incredicoaster brake run",text:"Ten minutes stopped in the sun, strapped in, listening to the safety loop.",joy:-6,comfort:-10,minutesLost:10},{id:"dca_carsland_heat",from:660,to:1020,park:"dca",kind:"bad",when:"day",w:6,title:"There is no shade in Cars Land",text:"It's a desert themed to look like a desert and it is doing an excellent job.",joy:-3,energy:-6,comfort:-15},{id:"dca_pier_wind",from:1020,to:1440,park:"dca",kind:"bad",when:"day",w:4,title:"The wind came up off the water",text:"Everything on the pier that spins has stopped, and you're cold in a t-shirt.",joy:-5,comfort:-11},{id:"dca_lamplight_full",from:960,to:1260,park:"dca",kind:"bad",when:"day",w:4,title:"Lamplight has nothing until nine",text:"No walk-ups, no cancellations, and you'd built the evening around it.",joy:-7,minutesLost:8},{id:"dca_woc_spray",park:"dca",kind:"bad",when:"day",w:4,title:"You were in the World of Color splash zone",text:"Nobody tells you which rows those are until it's much too late.",joy:-3,comfort:-14},{id:"dca_avengers_queue",park:"dca",kind:"bad",when:"day",w:5,title:"The whole of Avengers Campus queued at once",text:"Something let out and every line in the land doubled in about four minutes.",joy:-4,comfort:-5,waitMult:1.35,minutes:55},{id:"dca_bakery_closed",from:1080,to:1440,park:"dca",kind:"bad",when:"day",w:3,title:"The Bakery Tour has stopped for the day",text:"No sourdough, no free sample, and the smell is still coming out of the vents.",joy:-5},{id:"dca_swings_wind",from:1020,to:1440,park:"dca",kind:"bad",when:"day",w:3,title:"Silly Symphony Swings shut for wind",text:"Along with the Zephyr and the Jellyfish. Half of Paradise Gardens is standing still.",joy:-5},{id:"dca_hollywood_empty",park:"dca",kind:"bad",when:"day",w:3,title:"Hollywood Land feels half-finished",text:"A lot of shuttered frontage and not much going on behind it.",joy:-5,comfort:-3},{id:"dca_sanfran_lost",park:"dca",kind:"bad",when:"day",w:3,title:"You went round San Fransokyo twice",text:"Everything is at an angle and none of it points where you expect.",joy:-3,energy:-6,comfort:-4,minutesLost:9},{id:"dca_lagoon_walk",park:"dca",kind:"bad",when:"day",w:5,title:"The long way round the lagoon",text:"You can see where you want to be. Getting there is most of a mile.",joy:-3,energy:-10,comfort:-8,minutesLost:12},{id:"dca_cone_out",park:"dca",kind:"bad",when:"day",w:3,title:"Cozy Cone is out of the good one",text:"Just the plain cones left, and a queue for those.",joy:-5,minutesLost:7},{id:"dca_web_low",park:"dca",kind:"bad",when:"day",w:4,title:"Your WEB SLINGERS score was humiliating",text:"Beaten comprehensively by a seven-year-old in the next seat.",joy:-5,energy:-4},{id:"dca_guardians_scream",park:"dca",kind:"bad",when:"day",w:4,title:"The child next to you screamed the whole drop sequence",text:"Directly into your ear, at a pitch you didn't know was possible.",joy:-6,comfort:-4},{id:"dca_pier_crush",from:1080,to:1320,park:"dca",kind:"bad",when:"day",w:5,title:"Pixar Pier at parade time",text:"One narrow boardwalk, everyone on it, and nobody moving in the same direction.",joy:-5,energy:-4,comfort:-8,minutesLost:8},{id:"dca_soarin_smell",park:"dca",kind:"bad",when:"day",w:3,title:"The Soarin' scent effect misfired",text:"Orange grove, then nothing, then a great deal of orange grove all at once.",joy:-4},{id:"dca_stroller_park",park:"dca",kind:"bad",when:"day",w:3,title:"You can't find where you left the stroller",text:"They move them. They always move them.",joy:-5,energy:-4,minutesLost:12},{id:"dca_photopass_missed",from:1140,to:1440,park:"dca",kind:"bad",when:"day",w:3,title:"The Cars Land photographer had packed up",text:"You came back for it specially and the spot is empty.",joy:-5,energy:-3,minutesLost:8},{id:"dca_mermaid_stop",park:"dca",kind:"bad",when:"day",w:3,title:"Stopped inside Little Mermaid",text:"Under the Ursula scene, with the lights up. It is much less impressive lit.",joy:-4,minutesLost:6},{id:"dca_trolley_full",park:"dca",kind:"bad",when:"day",w:3,title:"The Red Car Trolley is full",text:"And it's the last one before it stops for the parade.",joy:-3,energy:-5,minutesLost:6}],oa=[{id:"bench",name:"Sit down for a bit",mins:20,cost:0,joy:-2,en:22,fuel:0,comfort:10,des rt:26,desc:"Air conditioning, a slow lap of the Emporium, and something you didn't plan to buy."},{id:"nap",name:"Mid-day break at the hotel",mins:240,cost:0,joy:12,en:95,fuel:16,comfort:100,window:[600,1080],desc:"Back to the room, feet up, an actual nap. You lose four hours of park time and come back a different person."},{id:"wander",name:"Wander with no plan",mins:25,cost:0,joy:-5,en:-5,fuel:0,comfort:-6,desc:"Drift around. Pleasant for five minutes, then the day is quietly slipping away."}],Hn=[{id:"dapperdans",park:"dl",w:10,title:"The Dapper Dans are singing on Main Street",text:"Four-part harmony, straw hats, the works. A small crowd is gathering.",options:[{label:"Stop and watch",sub:"Fifteen minutes of your day",joy:9,energy:4,comfort:4,minutesLost:15},{label:"Keep moving",sub:"You've somewhere to be",joy:-1,comfort:-1}]},{id:"paradecross",from:1080,to:1290,park:"dl",w:9,title:"A parade is forming across your path",text:"The rope is up and cast members are holding the crossing.",options:[{label:"Wait and watch it go by",sub:"Twenty minutes",joy:10,energy:2,comfort:3,minutesLost:20},{label:"Take the long way round",sub:"Faster, but it's a hike",joy:-2,energy:-11,comfort:-7,minutesLost:10}]},{id:"poncho",w:8,title:"It starts absolutely pelting down",text:"There are ponchos in the shop on the corner, or a covered walkway you could sit out under.",options:[{label:"Buy a poncho and carry on",sub:"$15, no time lost",money:-15,joy:-2,comfort:8},{label:"Shelter until it passes",sub:"Half an hour, but you rest",joy:-3,energy:13,comfort:20,minutesLost:30,waitMult:.8,minutes:40}]},{id:"spareLL",w:7,title:"A stranger offers you their spare Lightning Lane",text:"They're heading home early and would rather someone got the use of it. It's good for 1 ride. They ask twenty dollars.",options:[{label:"Take it",sub:"$20 for one line skip",money:-20,ll:1,joy:3},{label:"Politely decline",sub:"Keep the cash",joy:1}]},{id:"heel",w:7,title:"A hot spot on your heel is becoming a pr
